# `baked` is deliberately excluded (it needs key files at build time); CI
# exercises it separately with throwaway inputs.
[alias]
lint = "clippy --workspace --all-targets -- -D warnings"
# Type-check every supported target without needing cross linkers installed.
check-matrix = "check --workspace --target aarch64-apple-darwin --target x86_64-apple-darwin --target aarch64-unknown-linux-musl --target x86_64-unknown-linux-musl --target aarch64-linux-android"

# Android linking is intentionally not configured here: use `cargo ndk` or
# `cross`, which supply the NDK toolchain. See docs/01-architecture.md.
