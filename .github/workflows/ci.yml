name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Reads rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # `baked` needs key files at build time; use throwaway placeholders.
      - run: |
          printf 'mysh-x25519-secret AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\n' > "$RUNNER_TEMP/id"
          printf 'mysh-x25519 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= ci\n' > "$RUNNER_TEMP/peers"
          MYSH_BAKED_IDENTITY="$RUNNER_TEMP/id" MYSH_BAKED_PEERS="$RUNNER_TEMP/peers" \
            cargo clippy -p mysh --all-targets --features baked

  # Every required non-darwin release target (scripts/release.sh table),
  # type-checked only: no cross linkers are needed for `cargo check`.
  cross-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - i686-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-musl
          - x86_64-unknown-freebsd
          - aarch64-unknown-freebsd
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo check --workspace --target ${{ matrix.target }}

  # Stretch targets (scripts/release.sh `stretch` rows), never blocking.
  # Tier-2 rows are `cargo check`; tier-3 rows have no prebuilt std and go
  # through scripts/check-tier3.sh (nightly + `-Z build-std`).
  cross-check-stretch:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: i686-linux-android, tier: 2 }
          - { target: armv5te-unknown-linux-musleabi, tier: 2 }
          - { target: powerpc64le-unknown-linux-musl, tier: 2 }
          - { target: s390x-unknown-linux-gnu, tier: 2 }
          - { target: loongarch64-unknown-linux-musl, tier: 2 }
          - { target: x86_64-unknown-netbsd, tier: 2 }
          - { target: s390x-unknown-linux-musl, tier: 3 }
          - { target: mipsel-unknown-linux-musl, tier: 3 }
          - { target: mips-unknown-linux-musl, tier: 3 }
          - { target: aarch64-unknown-netbsd, tier: 3 }
          - { target: x86_64-unknown-openbsd, tier: 3 }
          - { target: aarch64-unknown-openbsd, tier: 3 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - if: matrix.tier == 3
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: stretch-${{ matrix.target }}
      - if: matrix.tier == 2
        run: cargo check --workspace --target ${{ matrix.target }}
      - if: matrix.tier == 3
        run: scripts/check-tier3.sh ${{ matrix.target }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
