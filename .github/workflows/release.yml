name: release

# Builds the five release binaries on a tag push and attaches them, with
# SHA256SUMS and the contrib/ files, to a GitHub release. Locally the same
# set is produced by scripts/release.sh.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-linux-android
            os: ubuntu-latest
            android: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p mysh
      - name: Build (android)
        if: matrix.android
        run: scripts/android-build.sh ${{ matrix.target }} 24
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - name: Build (native)
        if: ${{ !matrix.cross && !matrix.android }}
        run: cargo build --release --target ${{ matrix.target }} -p mysh
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mysh dist/mysh-$version-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mysh-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && shasum -a 256 mysh-* > SHA256SUMS && cat SHA256SUMS
      - name: Bundle contrib
        run: tar -C contrib -czf dist/mysh-contrib.tar.gz .
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
