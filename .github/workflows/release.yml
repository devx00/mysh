name: release

# Builds the release matrix on a tag push and attaches the binaries, with
# SHA256SUMS and the contrib/ files, to a GitHub release. Locally the same
# set is produced by scripts/release.sh; every job here calls that script so
# target naming and linker selection live in one place.
#
#   darwin   macOS runner, host clang, `lipo` universal binary
#   zig      ubuntu runner, zig + cargo-zigbuild for linux-musl and freebsd
#   android  ubuntu runner, the preinstalled NDK (ANDROID_NDK_LATEST_HOME)
#   stretch  ubuntu runner, zig + NDK + nightly (build-std for tier 3); the
#            `stretch` rows of the table, never blocking the release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: darwin
      - run: scripts/release.sh aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: mysh-darwin
          path: dist/mysh-*

  zig:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - i686-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-musl
          - x86_64-unknown-freebsd
          - aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0 # verified locally with cargo-zigbuild 0.24
      - run: cargo install cargo-zigbuild --locked
      - run: scripts/release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mysh-${{ matrix.target }}
          path: dist/mysh-*

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: scripts/release.sh ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - uses: actions/upload-artifact@v4
        with:
          name: mysh-${{ matrix.target }}
          path: dist/mysh-*

  stretch:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-linux-android
          - armv5te-unknown-linux-musleabi
          - powerpc64le-unknown-linux-musl
          - s390x-unknown-linux-gnu
          - s390x-unknown-linux-musl
          - loongarch64-unknown-linux-musl
          - mipsel-unknown-linux-musl
          - mips-unknown-linux-musl
          - x86_64-unknown-netbsd
          - aarch64-unknown-netbsd
          - x86_64-unknown-openbsd
          - aarch64-unknown-openbsd
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: stretch-${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: cargo install cargo-zigbuild --locked
      - run: scripts/release.sh ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - uses: actions/upload-artifact@v4
        with:
          name: mysh-${{ matrix.target }}
          path: dist/mysh-*

  release:
    needs: [darwin, zig, android, stretch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum mysh-* > SHA256SUMS && cat SHA256SUMS
      - name: Bundle contrib
        run: tar -C contrib -czf dist/mysh-contrib.tar.gz .
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
