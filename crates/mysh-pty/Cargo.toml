[package]
name = "mysh-pty"
description = "mysh platform layer: pseudo-terminals, controlling-tty spawn, terminal modes, window size, process introspection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mysh-proto.workspace = true
rustix.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# `getpwuid_r` (shell/home/user fallbacks) everywhere except Android, where
# bionic's passwd data is synthetic and the spec skips it; `proc_pidinfo` on
# macOS. Android needs nothing beyond rustix.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc.workspace = true

