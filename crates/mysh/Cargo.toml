[package]
name = "mysh"
description = "Minimal encrypted remote shell for personal infrastructure (client + server in one binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Compile an identity and trusted peers into the binary. Requires
# MYSH_BAKED_IDENTITY (private key file) and MYSH_BAKED_PEERS
# (authorized_keys-format file) at build time. See docs/02-security.md.
baked = []

[dependencies]
mysh-client.workspace = true
mysh-net.workspace = true
mysh-proto.workspace = true
mysh-pty.workspace = true

anyhow.workspace = true
base64.workspace = true
blake2.workspace = true
clap.workspace = true
dirs.workspace = true
indicatif.workspace = true
postcard.workspace = true
rpassword.workspace = true
# `system` adds `uname` for `Open::Info`.
rustix = { workspace = true, features = ["system"] }
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
