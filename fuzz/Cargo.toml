[package]
name = "mysh-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mysh-proto = { path = "../crates/mysh-proto" }
mysh-net = { path = "../crates/mysh-net" }
mysh = { path = "../crates/mysh" }
serde_json = "1"

# Standalone workspace: keeps nightly-only fuzzing out of the root workspace.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "proto_open"
path = "fuzz_targets/proto_open.rs"
test = false
doc = false
bench = false

