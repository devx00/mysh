[toolchain]
# Pinned for reproducible builds across machines and CI. Bump deliberately
# together with `rust-version` in Cargo.toml.
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# Every tier-2 release target (the `required` and `stretch` rows of
# scripts/release.sh that ship std), sorted. `cargo check-matrix` /
# `check-matrix-stretch` type-check them without a cross linker; tier-3
# rows build std on nightly (scripts/check-tier3.sh). See
# docs/01-architecture.md "Build" for linking.
targets = [
  "aarch64-apple-darwin",
  "aarch64-linux-android",
  "aarch64-unknown-freebsd",
  "aarch64-unknown-linux-musl",
  "arm-unknown-linux-musleabihf",
  "armv5te-unknown-linux-musleabi",
  "armv7-linux-androideabi",
  "armv7-unknown-linux-musleabihf",
  "i686-linux-android",
  "i686-unknown-linux-musl",
  "loongarch64-unknown-linux-musl",
  "powerpc64le-unknown-linux-musl",
  "riscv64gc-unknown-linux-musl",
  "s390x-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-linux-android",
  "x86_64-unknown-freebsd",
  "x86_64-unknown-linux-musl",
  "x86_64-unknown-netbsd",
]
